# Builds the live ISO and publishes it as a GitHub release: push a tag
# like v0.1.0, or run it by hand with a tag name. The ISO (under GitHub's
# 2 GiB per-file limit) and its SHA-256 are the release's assets; the site
# links to releases/latest/download/configurator-live-x86_64-linux.iso.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (created if it doesn't exist)
        required: true

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      # The ISO's closure, the catalog and the desktop screenshots need
      # more than the runner's free space.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      # The desktop screenshots boot every desktop in a VM.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm

      - name: Build the ISO
        run: |
          nix build .#iso -L --print-build-logs
          iso=$(ls result/iso/*.iso)
          cp "$iso" .
          sha256sum "$(basename "$iso")" > "$(basename "$iso").sha256"
          ls -l *.iso *.sha256

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="The NixOS Configurator live image for x86_64 PCs (UEFI and legacy BIOS).

          Write it to a USB stick (GNOME Disks, Fedora Media Writer, balenaEtcher, or \`dd\`), boot it with Secure Boot off, and follow the layers. The install downloads from the NixOS binary cache, so it needs the internet.

          SHA-256: \`$(cut -d' ' -f1 configurator-live-x86_64-linux.iso.sha256)\`"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" configurator-live-x86_64-linux.iso configurator-live-x86_64-linux.iso.sha256 --clobber
          else
            gh release create "$TAG" configurator-live-x86_64-linux.iso configurator-live-x86_64-linux.iso.sha256 \
              --title "NixOS Configurator $TAG" --notes "$notes" --target "$GITHUB_SHA"
          fi
